[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-optimizador"
version = "0.1.0"
description = "Evaluación de herramientas gratuitas, académicamente gratuitas y de código abierto para optimización matemática en Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "amplpy==0.18.0",
    "ampltools==0.7.5",
    "matplotlib==3.11.1",
    "pyomo==6.10.1",
    "highspy==1.15.1",
]

[project.optional-dependencies]
# Dependencias opcionales propuestas para futuras fases (consultar requirements-proposed-full-stack.txt)
proposed = [
    "numpy>=2.2.1",
    "pandas>=2.2.3",
    "scipy>=1.15.1",
    "pyscipopt>=6.2.1",
    "idaes-pse>=2.12.0",
    "pymoo>=0.6.2",
    "sympy>=1.14.0",
    "pydantic>=2.13.2",
    "streamlit>=1.62.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
]

