[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization_suite"
version = "0.1.0"
description = "Academic and research suite for mathematical and multiobjective optimization in Python without commercial solvers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "pyomo>=6.8.0",
    "highspy>=1.8.0",
    "pyscipopt>=5.0.0",
    "idaes-pse>=2.8.0",
    "pymoo>=0.6.0",
    "sympy>=1.12",
    "pydantic>=2.0.0",
    "streamlit>=1.35.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]
